appId: com.studyhub.app
productName: Study Hub
copyright: Copyright © 2024 Kaio

directories:
  output: dist
  buildResources: build

files:
  - electron/main.js
  - electron/preload.js
  - .next/**/*
  - node_modules/**/*
  - package.json
  - .env.local

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Study Hub

extraResources:
  - from: .next/standalone
    to: app
    filter:
      - "**/*"
